[project]
name = "tsumugi-inference"
version = "0.1.0"
description = "TSUMUGI inference server: SAM 3 segmentation and depth estimation on Apple Silicon (MPS)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=5.0",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "huggingface-hub>=0.30",
  "pillow>=11",
  "numpy>=2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "psutil>=6",
  "torchvision>=0.20",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.10",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pip-audit>=2.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
